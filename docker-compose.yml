# ============================================================================
# m-knowledge-assistant — Docker Compose 部署
# ============================================================================
# 前置条件:
#   - Milvus 已独立部署，配置 MILVUS_HOST / MILVUS_PORT 指向实际地址
#   - 复制 .env.example 为 .env 并填入 API Keys
#
# 启动:
#   docker compose up -d --build
#
# 初始化管理员:
#   docker compose exec backend python -m src.server.bootstrap_admin --name Administrator
# ============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: mka-backend:latest
    container_name: mka-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mka_data:/app/data
      - mka_storage:/app/storage/files
    networks:
      - mka_net
    depends_on: []
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: mka-nginx:latest
    container_name: mka-nginx
    restart: unless-stopped
    ports:
      - "9090:80"
    networks:
      - mka_net
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mka_data:
    name: mka_data
  mka_storage:
    name: mka_storage

networks:
  mka_net:
    name: mka_net
    driver: bridge
