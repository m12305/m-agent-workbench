<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>m-Knowledge Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════
   The Archive — Design Tokens
   ═══════════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* Palette */
  --paper:    #F8F9FB;   /* archival paper — cool white with blue undertone */
  --ink:      #1C2030;   /* deep blue-black text */
  --cobalt:   #3451C7;   /* primary accent — fountain pen blue */
  --cobalt-h: #2941A5;   /* hover state */
  --teal:     #0B7D76;   /* references, links, citations */
  --markup:   #C63636;   /* delete / danger — proofreader's red */
  --rule:     #E3E6ED;   /* borders, dividers */
  --surface:  #FFFFFF;   /* card surfaces */
  --muted:    #6B7280;   /* secondary text */
  --faint:    #9CA3AF;   /* placeholder / tertiary */
  --stack:    #EEF0F5;   /* subtle surface variation */
  --code-bg:  #F0F2F7;   /* code block background */
  --amber:    #B45309;   /* warning / in-progress */

  /* Typography */
  --sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC',
          system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas',
          'Courier New', monospace;

  /* Type Scale (1.25 ratio) */
  --text-xs:   0.75rem;    /* 12px */
  --text-sm:   0.8125rem;  /* 13px */
  --text-base: 0.9375rem;  /* 15px */
  --text-md:   1.125rem;   /* 18px */
  --text-lg:   1.375rem;   /* 22px */
  --text-xl:   1.75rem;    /* 28px */

  /* Spacing */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 36px;

  /* Geometry */
  --radius: 6px;
  --sidebar-w: 312px;
}

html, body {
  height: 100%; overflow: hidden;
  font-family: var(--sans);
  font-size: var(--text-base);
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ═══════════════════════════════════════════════════════════════════
   Masthead — minimal status bar
   ═══════════════════════════════════════════════════════════════════ */
#masthead {
  display: flex; align-items: center; gap: var(--space-sm);
  padding: 8px 20px; background: var(--surface);
  border-bottom: 1px solid var(--rule); flex-shrink: 0;
  font-size: var(--text-xs); color: var(--muted);
  position: relative; z-index: 10;
}
#masthead .wordmark {
  font-weight: 640; font-size: var(--text-sm); color: var(--ink);
  letter-spacing: -0.2px; margin-right: var(--space-sm);
}
#masthead .wordmark span { color: var(--cobalt); }

#masthead input {
  border: 1px solid var(--rule); border-radius: 5px;
  padding: 5px 10px; font-size: var(--text-xs); font-family: var(--sans);
  color: var(--ink); background: var(--stack); outline: none;
  transition: border-color .15s, background .15s;
}
#masthead input:focus { border-color: var(--cobalt); background: var(--surface); }
#api-base { width: 200px; }
#api-key  { width: 310px; font-family: var(--mono); font-size: 0.65rem; }

#btn-connect {
  padding: 5px 14px; border-radius: 5px; border: 1.5px solid var(--cobalt);
  background: transparent; color: var(--cobalt); cursor: pointer;
  font-size: var(--text-xs); font-weight: 600; white-space: nowrap;
  transition: all .18s; letter-spacing: 0.2px;
}
#btn-connect:hover { background: var(--cobalt); color: #fff; }

#status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
#status-dot.off { background: #C8CCD4; }
#status-dot.chk { background: var(--amber); animation: throb 1.2s infinite; }
#status-dot.ok  { background: #22A66B; box-shadow: 0 0 6px #22A66B55; }
#status-dot.err { background: var(--markup); }
@keyframes throb { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

#health-pills { display: flex; gap: 5px; margin-left: 4px; }
.pill { font-size: 0.625rem; padding: 2px 7px; border-radius: 3px;
  font-weight: 650; letter-spacing: 0.4px; text-transform: uppercase; }
.pill.up   { background: #E3F5ED; color: #1A7A4C; }
.pill.down { background: #FEF3C7; color: #92400E; }

#user-tag { margin-left: auto; font-size: var(--text-xs); color: var(--muted);
  display: flex; align-items: center; gap: 8px; }
#user-tag .role-chip { font-size: 0.625rem; padding: 2px 8px; border-radius: 10px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  background: var(--stack); border: 1px solid var(--rule); color: var(--muted); }
#user-tag .role-chip.admin { background: #EBF0FF; border-color: #C8D5F5; color: var(--cobalt); }

/* ═══════════════════════════════════════════════════════════════════
   Body — sidebar + reading room
   ═══════════════════════════════════════════════════════════════════ */
#body { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 42px); }

/* ── Sidebar: The Stacks ── */
#sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--surface); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; overflow: hidden;
}
#tab-bar { display: flex; border-bottom: 1px solid var(--rule); flex-shrink: 0;
  padding: 0 var(--space-sm); }
#tab-bar button {
  flex: 1; padding: 12px 0; background: none; border: none;
  color: var(--muted); cursor: pointer; font-size: var(--text-xs);
  font-family: var(--sans); font-weight: 520;
  border-bottom: 2px solid transparent; transition: all .15s;
  letter-spacing: 0.1px;
}
#tab-bar button:hover { color: var(--ink); }
#tab-bar button.active { color: var(--cobalt); border-bottom-color: var(--cobalt);
  font-weight: 600; }

.tab-panel { flex: 1; overflow-y: auto; display: none; flex-direction: column;
  padding: var(--space-sm); }
.tab-panel.active { display: flex; }

/* shelf header */
.shelf-action {
  width: 100%; padding: 9px 12px; border-radius: var(--radius);
  border: 1.5px dashed var(--rule); background: transparent;
  color: var(--cobalt); cursor: pointer; font-size: var(--text-xs);
  font-family: var(--sans); font-weight: 550; margin-bottom: var(--space-sm);
  flex-shrink: 0; transition: all .15s; letter-spacing: 0.1px;
}
.shelf-action:hover { background: var(--stack); border-color: var(--cobalt); }

.scroll-list { flex: 1; overflow-y: auto; }

/* card entries */
.entry {
  padding: 10px 12px; border-radius: var(--radius); cursor: pointer;
  margin-bottom: 2px; display: flex; align-items: center; gap: 8px;
  font-size: var(--text-sm); transition: background .12s;
  border: 1px solid transparent;
}
.entry:hover { background: var(--stack); }
.entry.active { background: #ECF0FA; border-color: #CED8F5; }
.entry .title {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  min-width: 0; font-weight: 470;
}
.entry .meta { font-size: var(--text-xs); color: var(--muted);
  white-space: nowrap; flex-shrink: 0; font-feature-settings: "tnum"; }
.entry .dl, .entry .del {
  flex-shrink: 0; opacity: 0; transition: opacity .12s;
  cursor: pointer; padding: 2px; line-height: 1;
  font-size: 0.9rem; font-weight: 500;
}
.entry .dl { color: var(--cobalt); }
.entry .del { color: var(--markup); }
.entry:hover .dl, .entry:hover .del { opacity: 1; }

/* badges */
.badge {
  font-size: 0.625rem; padding: 2px 8px; border-radius: 10px;
  font-weight: 600; white-space: nowrap; flex-shrink: 0;
  letter-spacing: 0.3px; text-transform: uppercase;
}
.badge.queued, .badge.uploaded  { background: #E8EDF8; color: var(--cobalt); }
.badge.parsing, .badge.chunking, .badge.embedding { background: #FEF3C7; color: #92400E; }
.badge.indexed, .badge.done  { background: #E3F5ED; color: #1A7A4C; }
.badge.failed { background: #FDE8E8; color: #9B1C1C; }

/* scope chip */
.scope-chip {
  font-size: 0.6rem; padding: 1px 6px; border-radius: 3px;
  flex-shrink: 0; font-weight: 550; letter-spacing: 0.3px;
  text-transform: uppercase; border: 1px solid var(--rule); color: var(--muted);
}

/* upload zone */
#upload-zone {
  border: 2px dashed var(--rule); border-radius: var(--radius);
  padding: 20px 16px; text-align: center; color: var(--muted);
  cursor: pointer; margin-bottom: var(--space-sm); flex-shrink: 0;
  font-size: var(--text-sm); transition: all .2s; background: var(--stack);
}
#upload-zone:hover, #upload-zone.dragover {
  border-color: var(--cobalt); color: var(--cobalt); background: #ECF0FA; }
#upload-zone small { display: block; margin-top: 5px; opacity: 0.7;
  font-size: var(--text-xs); }
#upload-scope-row {
  display: flex; gap: 8px; margin-bottom: var(--space-sm); flex-shrink: 0;
  align-items: center; font-size: var(--text-xs); color: var(--muted);
  padding: 0 2px;
}
#upload-scope-row select {
  background: var(--surface); border: 1px solid var(--rule); color: var(--ink);
  border-radius: 4px; padding: 4px 8px; font-size: var(--text-xs);
  font-family: var(--sans); cursor: pointer;
}

/* ── System Panel ── */
.sys-card {
  background: var(--stack); border-radius: var(--radius);
  padding: 14px; margin-bottom: var(--space-sm); border: 1px solid var(--rule);
}
.sys-card h4 { font-size: var(--text-xs); margin-bottom: 10px; color: var(--muted);
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
.sys-row { display: flex; justify-content: space-between; align-items: center;
  font-size: var(--text-sm); padding: 5px 0;
  border-bottom: 1px solid rgba(0,0,0,0.04); }
.sys-row:last-child { border-bottom: none; }
.sys-row .label { color: var(--muted); }
.sys-row .value { font-family: var(--mono); font-size: var(--text-xs);
  font-weight: 500; }
.sys-row .value.good { color: #1A7A4C; }
.sys-row .value.warn { color: #92400E; }
.sys-row .value.bad  { color: #9B1C1C; }

/* ── Reading Room (main chat) ── */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden;
  background: var(--paper); }

/* context bar */
#ctx-bar {
  padding: 10px 24px; border-bottom: 1px solid var(--rule);
  background: var(--paper); display: flex; gap: var(--space-sm);
  align-items: center; flex-shrink: 0;
}
#ctx-bar select {
  background: var(--surface); border: 1px solid var(--rule); color: var(--ink);
  border-radius: 5px; padding: 5px 10px; font-size: var(--text-xs);
  font-family: var(--sans); cursor: pointer;
}

/* message list */
#msg-list {
  flex: 1; overflow-y: auto; padding: var(--space-xl) 0;
  display: flex; flex-direction: column; align-items: center;
  gap: var(--space-lg);
}
#msg-list .empty-state {
  color: var(--muted); text-align: center; margin-top: 120px;
  max-width: 420px;
}
#msg-list .empty-state .colophon {
  font-family: var(--mono); font-size: 0.7rem; color: var(--faint);
  margin-top: var(--space-lg); letter-spacing: 0.3px;
}
#msg-list .empty-state .wordmark-lg {
  font-size: 4rem; font-weight: 640; color: var(--ink);
  letter-spacing: -1.5px; margin-bottom: var(--space-lg);
  line-height: 1;
}
#msg-list .empty-state .wordmark-lg span { color: var(--cobalt); }

/* ── Messages as typeset pages ── */
.msg-wrap { width: 100%; max-width: 720px; padding: 0 var(--space-md); }

.msg {
  max-width: 65ch; padding: var(--space-md) var(--space-lg);
  border-radius: 10px; font-size: var(--text-base);
  line-height: 1.72; animation: fadeUp .3s ease-out;
  position: relative;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; } }

.msg.user {
  margin-left: auto; margin-right: 0;
  background: var(--surface); border: 1px solid var(--rule);
  color: var(--ink); border-bottom-right-radius: 3px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}

.msg.assistant {
  margin-left: 0; margin-right: auto;
  background: transparent; color: var(--ink);
  border-bottom-left-radius: 3px;
}

.msg .byline {
  font-size: 0.625rem; color: var(--faint); margin-bottom: var(--space-sm);
  font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase;
}
.msg.user .byline { color: var(--muted); }

/* assistant message typography — the signature "reading column" */
.msg.assistant h1 { font-size: var(--text-xl); font-weight: 620;
  letter-spacing: -0.5px; margin: var(--space-lg) 0 var(--space-sm);
  line-height: 1.25; color: var(--ink); }
.msg.assistant h2 { font-size: var(--text-lg); font-weight: 620;
  letter-spacing: -0.3px; margin: var(--space-lg) 0 var(--space-sm);
  line-height: 1.3; padding-bottom: var(--space-xs);
  border-bottom: 1.5px solid var(--rule); color: var(--ink); }
.msg.assistant h3 { font-size: var(--text-md); font-weight: 600;
  margin: var(--space-md) 0 var(--space-xs);
  line-height: 1.35; color: var(--ink); }
.msg.assistant h4 { font-size: var(--text-base); font-weight: 600;
  margin: var(--space-sm) 0 2px;
  text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); }

.msg.assistant p { margin: 0 0 var(--space-sm); }
.msg.assistant p:last-child { margin-bottom: 0; }

.msg.assistant ul, .msg.assistant ol { padding-left: 1.5em;
  margin: var(--space-sm) 0; }
.msg.assistant li { margin: 3px 0; padding-left: 2px; }
.msg.assistant li::marker { color: var(--cobalt); }

.msg.assistant blockquote {
  border-left: 3px solid var(--cobalt); padding: var(--space-xs) var(--space-md);
  margin: var(--space-md) 0; color: var(--muted);
  background: #F7F8FB; border-radius: 0 4px 4px 0;
  font-style: italic; font-size: 0.95em;
}

.msg.assistant pre {
  background: #F2F3F7; padding: var(--space-md); border-radius: 8px;
  overflow-x: auto; margin: var(--space-md) 0;
  font-family: var(--mono); font-size: 0.8rem; line-height: 1.6;
  border: 1px solid var(--rule); color: #383D4A;
}
.msg.assistant code {
  font-family: var(--mono); font-size: 0.82em;
  background: #EEF0F5; padding: 2px 6px; border-radius: 3px;
  color: #4A3F6B;
}
.msg.assistant pre code { background: none; padding: 0; color: inherit; font-size: inherit; }

.msg.assistant table {
  border-collapse: collapse; margin: var(--space-md) 0;
  width: 100%; font-size: var(--text-sm);
}
.msg.assistant th {
  background: var(--stack); border: 1px solid var(--rule);
  padding: 8px 12px; text-align: left; font-weight: 600;
  font-size: var(--text-xs); color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.4px;
}
.msg.assistant td {
  border: 1px solid var(--rule); padding: 8px 12px;
  background: var(--surface);
}

.msg.assistant a { color: var(--teal); text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--teal) 30%, transparent); }
.msg.assistant a:hover { border-bottom-color: var(--teal); }
.msg.assistant strong { font-weight: 620; color: var(--ink); }

/* colophon — metadata under assistant messages */
.colophon {
  margin-top: var(--space-md); padding-top: var(--space-sm);
  border-top: 1px solid var(--rule);
  font-size: var(--text-xs); color: var(--faint);
  font-feature-settings: "tnum"; letter-spacing: 0.2px;
}

/* ── Margin note (signature element) ── */
.msg.assistant .src-note {
  position: relative; padding-left: 14px; margin: var(--space-sm) 0;
  border-left: 2.5px solid var(--teal);
  font-size: var(--text-sm); color: var(--muted);
  line-height: 1.5;
}
.msg.assistant .src-note::before {
  content: "¶"; position: absolute; left: -1px; top: -2px;
  font-size: 0.6rem; color: var(--teal); background: var(--paper);
  padding: 0 4px 0 0; line-height: 1;
}
.msg.assistant .src-note .doc-label {
  font-weight: 600; color: var(--teal); font-size: var(--text-xs);
  text-transform: uppercase; letter-spacing: 0.4px;
}

/* ── Input Area ── */
#input-area {
  padding: var(--space-md) var(--space-lg); border-top: 1px solid var(--rule);
  background: var(--paper); display: flex; gap: var(--space-sm);
  align-items: flex-end; flex-shrink: 0; justify-content: center;
}
#input-area .input-inner { display: flex; gap: var(--space-sm);
  align-items: flex-end; width: 100%; max-width: 752px; }

#input-area textarea {
  flex: 1; background: var(--surface); border: 1.5px solid var(--rule);
  color: var(--ink); border-radius: 10px; padding: 11px 16px;
  font-size: var(--text-base); font-family: var(--sans);
  resize: none; outline: none; min-height: 44px; max-height: 160px;
  transition: border-color .2s; line-height: 1.5;
}
#input-area textarea:focus { border-color: var(--cobalt); box-shadow: 0 0 0 3px #3451C715; }

#input-area button {
  padding: 11px 22px; border-radius: 10px; border: none;
  background: var(--cobalt); color: #fff; cursor: pointer;
  font-size: var(--text-sm); font-weight: 600; white-space: nowrap;
  transition: background .15s, opacity .15s; letter-spacing: 0.2px;
}
#input-area button:hover { background: var(--cobalt-h); }
#input-area button:disabled { opacity: .4; cursor: not-allowed; }

#chk-stream { display: flex; align-items: center; gap: 5px;
  font-size: var(--text-xs); color: var(--muted); cursor: pointer;
  user-select: none; white-space: nowrap; padding: 0 2px; }
#chk-stream input { accent-color: var(--cobalt); }

/* utility */
.empty-note { color: var(--faint); text-align: center; padding: 32px 16px;
  font-size: var(--text-sm); line-height: 1.7; }

/* ── Toast ── */
#toast { position: fixed; top: 50px; right: 20px; z-index: 999;
  display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast-item { padding: 10px 16px; border-radius: 8px; font-size: var(--text-sm);
  animation: toastIn .25s; max-width: 400px; pointer-events: auto;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1); font-weight: 500; }
.toast-item.err { background: #FDE8E8; color: #9B1C1C; border: 1px solid #F4C7C7; }
.toast-item.ok  { background: #E3F5ED; color: #1A7A4C; border: 1px solid #B7E4CF; }
.toast-item.info { background: #E8EDF8; color: var(--cobalt); border: 1px solid #CED8F5; }
@keyframes toastIn { from { opacity:0; transform: translateX(24px); } to { opacity:1; } }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #D0D4DD; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #B0B5C0; }

/* ── Spin ── */
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--rule);
  border-top-color: var(--cobalt); border-radius: 50%; animation: spin .55s linear infinite;
  vertical-align: middle; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Responsive ── */
@media (max-width: 768px) {
  #sidebar { width: 100%; position: absolute; top: 42px; left: 0; bottom: 0;
    z-index: 20; display: none; }
  #sidebar.open { display: flex; }
  #masthead { padding: 8px 12px; gap: 6px; }
  #api-base { width: 120px; } #api-key { width: 160px; }
  .msg { max-width: 100%; padding: var(--space-sm) var(--space-md); }
  #msg-list { padding: var(--space-md) 0; }
  #input-area { padding: var(--space-sm) var(--space-md); }
  #input-area .input-inner { max-width: 100%; }
  #health-pills { display: none; }
}

/* ── Admin Panel ── */
#tab-admin .user-card {
  background: var(--stack); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 10px 12px; margin-bottom: 6px;
}
#tab-admin .user-card .row1 { display: flex; align-items: center; gap: 8px;
  font-size: var(--text-sm); }
#tab-admin .user-card .row1 .uname { font-weight: 600; flex: 1; }
#tab-admin .user-card .row2 { margin-top: 6px; font-size: var(--text-xs);
  color: var(--muted); }
#tab-admin .user-card .key-row { display: flex; align-items: center; gap: 6px;
  padding: 4px 0; font-size: var(--text-xs); }
#tab-admin .user-card .key-row .kpre { font-family: var(--mono); font-size: 0.7rem;
  color: var(--ink); flex: 1; }
#tab-admin .user-card .key-row .kts { color: var(--faint); margin-right: 6px; }
#tab-admin .mini-btn {
  font-size: 0.65rem; padding: 2px 8px; border-radius: 3px;
  border: 1px solid var(--rule); background: var(--surface); cursor: pointer;
  color: var(--muted); font-family: var(--sans); transition: all .12s;
}
#tab-admin .mini-btn:hover { border-color: var(--cobalt); color: var(--cobalt); }
#tab-admin .mini-btn.danger:hover { border-color: var(--markup); color: var(--markup); }
#tab-admin .create-row { display: flex; gap: 6px; margin-bottom: var(--space-sm);
  align-items: center; }
#tab-admin .create-row input, #tab-admin .create-row select {
  border: 1px solid var(--rule); border-radius: 4px; padding: 5px 8px;
  font-size: var(--text-xs); font-family: var(--sans); background: var(--surface);
  color: var(--ink); outline: none; }
#tab-admin .create-row input:focus, #tab-admin .create-row select:focus {
  border-color: var(--cobalt); }
#tab-admin .create-row input { flex: 1; }
#tab-admin .create-row select { width: 72px; }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════
     Masthead
     ═══════════════════════════════════════════════════════════════════ -->
<div id="masthead">
  <span class="wordmark">m<span>·</span>Knowledge</span>
  <input id="api-base" placeholder="http://localhost:8000/api/v1" spellcheck="false">
  <input id="api-key" type="password" placeholder="API Key" spellcheck="false">
  <button id="btn-connect" onclick="doConnect()">连接</button>
  <span id="status-dot" class="off" title="未连接"></span>
  <span id="health-pills"></span>
  <span id="user-tag"></span>
</div>

<!-- ═══════════════════════════════════════════════════════════════════
     Body
     ═══════════════════════════════════════════════════════════════════ -->
<div id="body">

  <!-- Sidebar: The Stacks -->
  <div id="sidebar">
    <div id="tab-bar">
      <button class="active" data-tab="sessions">会话</button>
      <button data-tab="documents">文档</button>
      <button data-tab="admin" style="display:none;">管理</button>
      <button data-tab="system">系统</button>
    </div>

    <!-- Sessions -->
    <div id="tab-sessions" class="tab-panel active">
      <button class="shelf-action" onclick="doCreateSession()">+ 新建会话</button>
      <div id="session-list" class="scroll-list">
        <div class="empty-note">连接后加载会话</div>
      </div>
    </div>

    <!-- Documents -->
    <div id="tab-documents" class="tab-panel">
      <div id="upload-scope-row">
        <span>范围</span>
        <select id="upload-scope">
          <option value="private">私有</option>
          <option value="shared">共享</option>
        </select>
      </div>
      <div id="upload-zone">
        拖拽文件到此处或点击上传
        <small>txt · md · pdf (≤20MB)</small>
      </div>
      <input type="file" id="file-input" hidden accept=".txt,.md,.pdf"
             onchange="doUpload(this.files[0])">
      <div id="doc-list" class="scroll-list">
        <div class="empty-note">连接后加载文档</div>
      </div>
    </div>

    <!-- Admin -->
    <div id="tab-admin" class="tab-panel">
      <!-- Create User -->
      <div class="create-row">
        <input id="new-user-name" placeholder="用户名" spellcheck="false">
        <select id="new-user-role"><option value="user">user</option><option value="admin">admin</option></select>
        <button class="shelf-action" style="margin:0;padding:5px 12px;flex:0;" onclick="doCreateUser()">创建</button>
      </div>
      <div id="user-list" class="scroll-list">
        <div class="empty-note">连接后加载用户</div>
      </div>
    </div>

    <!-- System -->
    <div id="tab-system" class="tab-panel">
      <div class="empty-note" id="sys-empty">连接后检查系统状态</div>
      <div id="sys-content" style="display:none;"></div>
    </div>
  </div>

  <!-- Reading Room (chat) -->
  <div id="main">
    <div id="ctx-bar">
      <select id="input-scope">
        <option value="hybrid">全部知识</option>
        <option value="private">仅私有</option>
        <option value="shared">仅共享</option>
      </select>
    </div>

    <div id="msg-list">
      <div class="empty-state">
        <div class="wordmark-lg">m<span>·</span>K</div>
        <p>企业知识助手 — 连接你的文档，用自然语言提问</p>
        <p class="colophon">配置 API 端点与密钥后点击「连接」开始</p>
      </div>
    </div>

    <div id="input-area">
      <div class="input-inner">
        <label id="chk-stream"><input type="checkbox" id="toggle-stream" checked> 流式输出</label>
        <textarea id="chat-input" rows="1" placeholder="提出问题，Enter 发送…"></textarea>
        <button id="btn-send" onclick="doSend()">发送</button>
      </div>
    </div>
  </div>

</div>

<!-- Toast -->
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   marked.js
   ═══════════════════════════════════════════════════════════════════ */
if (typeof marked !== 'undefined') {
  marked.setOptions({ breaks: true });
}

/* ═══════════════════════════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const ST = {
  base: '', key: '', connected: false,
  userId: '', userName: '', role: '',
  sessions: [], activeSid: null,
  docs: [],
  health: null,
  sending: false,
};

/* ═══════════════════════════════════════════════════════════════════
   Persistence
   ═══════════════════════════════════════════════════════════════════ */
function loadCfg() {
  ST.base = localStorage.getItem('mka_base') || 'http://localhost:8000/api/v1';
  ST.key  = localStorage.getItem('mka_key')  || '';
  $('api-base').value = ST.base;
  $('api-key').value  = ST.key;
}
function saveCfg() {
  ST.base = $('api-base').value.trim();
  ST.key  = $('api-key').value.trim();
  localStorage.setItem('mka_base', ST.base);
  localStorage.setItem('mka_key',  ST.key);
}
loadCfg();

/* ═══════════════════════════════════════════════════════════════════
   HTTP helpers
   ═══════════════════════════════════════════════════════════════════ */
function apiUrl(path) { return ST.base.replace(/\/+$/, '') + path; }
function hdrs(ct = true) {
  const h = {};
  if (ct) h['Content-Type'] = 'application/json';
  if (ST.key) h['Authorization'] = 'Bearer ' + ST.key;
  return h;
}

async function api(method, path, body) {
  const opts = { method, headers: hdrs() };
  if (body) opts.body = JSON.stringify(body);
  const t0 = performance.now();
  const res = await fetch(apiUrl(path), opts);
  const ms = Math.round(performance.now() - t0);
  if (!res.ok) {
    let msg = `${res.status} ${res.statusText}`;
    try { const e = await res.json(); msg = e.error?.message || e.detail || msg; } catch (_) {}
    throw new Error(msg);
  }
  if (res.status === 204) return { _ms: ms };
  const data = await res.json();
  data._ms = ms;
  return data;
}

/* ═══════════════════════════════════════════════════════════════════
   Toast
   ═══════════════════════════════════════════════════════════════════ */
function toast(msg, type = 'err') {
  const el = document.createElement('div');
  el.className = `toast-item ${type}`;
  el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s';
    setTimeout(() => el.remove(), 300); }, 3500);
}

/* ═══════════════════════════════════════════════════════════════════
   Connect + Health
   ═══════════════════════════════════════════════════════════════════ */
function setStatus(s) {
  const d = $('status-dot');
  d.className = s;
  d.title = { off: '未连接', chk: '检测中…', ok: '已连接', err: '连接失败' }[s] || '';
}

function rootUrl(path) {
  const base = ST.base.replace(/\/+$/, '');
  const root = base.replace(/\/api\/v\d+$/, '').replace(/\/+$/, '');
  return root + path;
}

async function doConnect() {
  saveCfg(); setStatus('chk');
  try {
    const [me, ready] = await Promise.all([
      api('GET', '/me'),
      fetch(rootUrl('/health/ready'), { headers: hdrs(false) }).then(r => r.json()).catch(() => null),
    ]);
    ST.connected = true;
    ST.userId = me.user_id; ST.userName = me.name; ST.role = me.role;
    ST.health = ready?.checks || null;
    setStatus('ok');
    $('user-tag').innerHTML = `${esc(me.name)} <span class="role-chip ${me.role}">${me.role}</span>`;
    if (ST.role !== 'admin') {
      $('upload-scope').value = 'private';
      $('upload-scope').querySelector('option[value="shared"]')?.setAttribute('disabled', '');
    } else {
      // show admin tab
      const adminBtn = document.querySelector('#tab-bar button[data-tab="admin"]');
      if (adminBtn) adminBtn.style.display = '';
    }
    renderHealthPills();
    toast('已连接 · ' + (me._ms || '?') + 'ms', 'ok');
    await Promise.all([loadSessions(), loadDocs(), renderSystem()]);
  } catch (e) {
    ST.connected = false; ST.health = null; setStatus('err');
    $('user-tag').innerHTML = '';
    $('health-pills').innerHTML = '';
    toast('连接失败: ' + e.message);
  }
}

function renderHealthPills() {
  const h = ST.health || {};
  const items = [
    ['EMB', h.embedding === 'ok'],
    ['MIL', h.milvus === 'ok'],
    ['RET', h.retrieval === 'ok'],
  ];
  $('health-pills').innerHTML = items.map(([label, ok]) =>
    `<span class="pill ${ok ? 'up' : 'down'}">${label}</span>`
  ).join('');
}

/* ═══════════════════════════════════════════════════════════════════
   Sessions
   ═══════════════════════════════════════════════════════════════════ */
async function loadSessions() {
  if (!ST.connected) return;
  try {
    ST.sessions = (await api('GET', '/sessions')) || [];
    renderSessions();
  } catch (e) { toast('加载会话失败: ' + e.message); }
}

async function doCreateSession() {
  if (!ST.connected) return;
  try {
    const s = await api('POST', '/sessions', { title: null });
    ST.sessions.unshift(s);
    ST.activeSid = s.session_id;
    renderSessions();
    $('msg-list').innerHTML = '';
    $('chat-input').focus();
    toast('会话已创建', 'ok');
  } catch (e) { toast('创建失败: ' + e.message); }
}

async function doSelectSession(sid) {
  ST.activeSid = sid;
  renderSessions();
  try {
    const msgs = await api('GET', `/sessions/${sid}/messages`);
    renderMessages(msgs || []);
  } catch (e) { toast('加载消息失败: ' + e.message); }
}

async function doDeleteSession(sid, ev) {
  ev.stopPropagation();
  if (!confirm('删除此会话？')) return;
  try {
    await api('DELETE', `/sessions/${sid}`);
    ST.sessions = ST.sessions.filter(s => s.session_id !== sid);
    if (ST.activeSid === sid) {
      ST.activeSid = null;
      $('msg-list').innerHTML = '<div class="empty-state"><div class="wordmark-lg">m<span>·</span>K</div><p>选择一个会话</p></div>';
    }
    renderSessions();
    toast('会话已删除', 'ok');
  } catch (e) { toast('删除失败: ' + e.message); }
}

function renderSessions() {
  const el = $('session-list');
  if (!ST.sessions.length) {
    el.innerHTML = '<div class="empty-note">暂无会话</div>'; return;
  }
  el.innerHTML = ST.sessions.map(s => `
    <div class="entry ${s.session_id === ST.activeSid ? 'active' : ''}"
         onclick="doSelectSession('${s.session_id}')">
      <span class="title">${esc(s.title || '未命名')}</span>
      <span class="meta">${s.message_count || 0}</span>
      <span class="del" title="删除" onclick="doDeleteSession('${s.session_id}', event)">×</span>
    </div>
  `).join('');
}

/* ═══════════════════════════════════════════════════════════════════
   Messages
   ═══════════════════════════════════════════════════════════════════ */
function renderMessages(msgs) {
  const el = $('msg-list');
  if (!msgs.length) {
    el.innerHTML = '<div class="empty-state"><p style="color:var(--muted)">开始一段新的对话</p></div>';
    return;
  }
  el.innerHTML = msgs.map(m => msgToHTML(m)).join('');
  el.scrollTop = el.scrollHeight;
}

function msgToHTML(m) {
  const byline = m.role === 'user' ? 'You' : 'Assistant';
  const body = m.role === 'assistant' ? md(m.content) : `<p>${esc(m.content)}</p>`;
  if (m.role === 'assistant' && m.sources && m.sources.length) {
    const notes = m.sources.map(s =>
      `<div class="src-note"><span class="doc-label">${esc(s.filename || s.title || '')}</span><br>${esc(s.excerpt || s.text || '')}</div>`
    ).join('');
    return `<div class="msg-wrap"><div class="msg assistant"><div class="byline">${byline}</div>${body}${notes}</div></div>`;
  }
  return `<div class="msg-wrap"><div class="msg ${m.role}"><div class="byline">${byline}</div>${body}</div></div>`;
}

function appendMsg(role, html) {
  const el = $('msg-list');
  const es = el.querySelector('.empty-state');
  if (es) es.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap';
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="byline">${role === 'user' ? 'You' : 'Assistant'}</div>${html}`;
  wrap.appendChild(div);
  el.appendChild(wrap);
  el.scrollTop = el.scrollHeight;
  return div;
}

/* ═══════════════════════════════════════════════════════════════════
   Chat
   ═══════════════════════════════════════════════════════════════════ */
async function doSend() {
  if (!ST.connected) { toast('请先连接'); return; }
  if (ST.sending) return;
  const input = $('chat-input');
  const query = input.value.trim();
  if (!query) return;

  if (!ST.activeSid) await doCreateSession();
  if (!ST.activeSid) return;

  input.value = ''; input.style.height = 'auto';
  const scope = $('input-scope').value;
  appendMsg('user', `<p>${esc(query)}</p>${scope !== 'hybrid' ? `<div style="font-size:0.7rem;color:var(--faint);margin-top:4px;">scope: ${scope}</div>` : ''}`);

  ST.sending = true; $('btn-send').disabled = true;
  try {
    if ($('toggle-stream').checked) {
      await chatStream(query, scope);
    } else {
      await chatSync(query, scope);
    }
  } finally {
    ST.sending = false; $('btn-send').disabled = false;
    $('chat-input').focus();
    loadSessions();
  }
}

async function chatSync(query, scope) {
  const t0 = performance.now();
  try {
    const res = await api('POST', '/chat', {
      query, session_id: ST.activeSid, knowledge_scope: scope,
    });
    const ms = res._ms || Math.round(performance.now() - t0);
    let body = md(res.answer);
    // render sources as margin notes if present
    if (res.sources && res.sources.length) {
      body += res.sources.map(s =>
        `<div class="src-note"><span class="doc-label">${esc(s.filename || s.title || '')}</span><br>${esc(s.excerpt || s.text || '')}</div>`
      ).join('');
    }
    body += `<div class="colophon">${ms}ms</div>`;
    appendMsg('assistant', body);
  } catch (e) {
    appendMsg('assistant', `<span style="color:var(--markup);">错误: ${esc(e.message)}</span>`);
  }
}

async function chatStream(query, scope) {
  const div = appendMsg('assistant', '<span class="spin"></span> 检索中…');
  let full = '';
  const t0 = performance.now();

  try {
    const resp = await fetch(apiUrl('/chat/stream'), {
      method: 'POST',
      headers: { ...hdrs(), 'Accept': 'text/event-stream' },
      body: JSON.stringify({ query, session_id: ST.activeSid, knowledge_scope: scope }),
    });
    if (!resp.ok) {
      const e = await resp.json().catch(() => ({}));
      throw new Error(e.error?.message || e.detail || `${resp.status}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (data.text) {
              full += data.text;
              div.innerHTML = md(full);
              $('msg-list').scrollTop = $('msg-list').scrollHeight;
            }
          } catch (_) { /* partial chunk */ }
        } else if (line.startsWith('event: error')) {
          console.warn('SSE error event');
        }
      }
    }
    if (buf.startsWith('data: ')) {
      try {
        const data = JSON.parse(buf.slice(6));
        if (data.text) { full += data.text; }
      } catch (_) {}
    }

    const ms = Math.round(performance.now() - t0);
    if (!full) {
      div.innerHTML = '<span style="color:var(--faint);">(空响应)</span>';
    } else {
      const tps = (full.length / Math.max(ms / 1000, 0.001)).toFixed(0);
      div.innerHTML = md(full) + `<div class="colophon">${tps} tok/s · ${ms}ms</div>`;
    }
  } catch (e) {
    div.innerHTML = `<span style="color:var(--markup);">流错误: ${esc(e.message)}</span>`;
  }
}

/* ═══════════════════════════════════════════════════════════════════
   Documents
   ═══════════════════════════════════════════════════════════════════ */
async function loadDocs() {
  if (!ST.connected) return;
  try {
    ST.docs = (await api('GET', '/documents')) || [];
    renderDocs();
  } catch (e) { toast('加载文档失败: ' + e.message); }
}

async function doUpload(file) {
  if (!ST.connected) { toast('请先连接'); return; }
  if (!file) return;
  const scope = $('upload-scope').value;
  const form = new FormData();
  form.append('file', file);
  form.append('scope', scope);

  try {
    const res = await fetch(apiUrl('/documents'), {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + ST.key },
      body: form,
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.error?.message || e.detail || res.statusText);
    }
    const data = await res.json();
    toast(`已上传: ${data.filename} [${data.scope}] · 任务: ${data.task_id}`, 'ok');
    $('file-input').value = '';
    await loadDocs();
    pollTask(data.task_id);
  } catch (e) { toast('上传失败: ' + e.message); }
  $('file-input').value = '';
}

async function pollTask(taskId) {
  let attempts = 0;
  const check = async () => {
    if (attempts > 120) return;
    attempts++;
    try {
      const t = await api('GET', `/tasks/${taskId}`);
      if (t.status === 'indexed') {
        toast(`索引完成 · ${Math.round(t.progress * 100)}%`, 'ok');
        await loadDocs(); return;
      }
      if (t.status === 'failed') {
        toast(`处理失败: ${t.error_message || '未知错误'}`); await loadDocs(); return;
      }
      setTimeout(check, 2000);
    } catch (_) { setTimeout(check, 3000); }
  };
  setTimeout(check, 1500);
}

function doDownload(did, filename, ev) {
  ev.stopPropagation();
  fetch(apiUrl(`/documents/${did}/download`), { headers: hdrs(false) })
    .then(r => { if (!r.ok) throw new Error(r.statusText); return r.blob(); })
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    })
    .catch(err => toast('下载失败: ' + err.message));
}

async function doDeleteDoc(did, ev) {
  ev.stopPropagation();
  if (!confirm('删除此文档？')) return;
  try {
    await api('DELETE', `/documents/${did}`);
    ST.docs = ST.docs.filter(d => d.document_id !== did);
    renderDocs();
    toast('文档已删除', 'ok');
  } catch (e) { toast('删除失败: ' + e.message); }
}

function renderDocs() {
  const el = $('doc-list');
  if (!ST.docs.length) { el.innerHTML = '<div class="empty-note">暂无文档</div>'; return; }
  el.innerHTML = ST.docs.map(d => `
    <div class="entry" onclick="navigator.clipboard?.writeText('${d.document_id}');toast('ID 已复制: ${d.document_id}','info')">
      <span class="title">${esc(d.filename)}</span>
      <span class="scope-chip">${d.scope}</span>
      <span class="badge ${d.status}">${d.status}</span>
      <span class="meta">${fmtSize(d.file_size)}</span>
      <span class="dl" title="下载" onclick="doDownload('${d.document_id}','${esc(d.filename)}',event)">↓</span>
      <span class="del" title="删除" onclick="doDeleteDoc('${d.document_id}', event)">×</span>
    </div>
  `).join('');
}

/* ═══════════════════════════════════════════════════════════════════
   System Panel
   ═══════════════════════════════════════════════════════════════════ */
async function renderSystem() {
  if (!ST.connected) return;
  $('sys-empty').style.display = 'none';
  $('sys-content').style.display = 'block';
  const h = ST.health || {};
  const rows = [
    ['Chat Agent', 'ok', 'good'],
    ['Embedding', h.embedding || 'unknown', h.embedding === 'ok' ? 'good' : 'warn'],
    ['Milvus', h.milvus || 'unknown', h.milvus === 'ok' ? 'good' : 'warn'],
    ['Retrieval', h.retrieval || 'unknown', h.retrieval === 'ok' ? 'good' : 'warn'],
  ];

  let html = '<div class="sys-card"><h4>服务状态</h4>';
  for (const [label, val, cls] of rows) {
    html += `<div class="sys-row"><span class="label">${label}</span><span class="value ${cls}">${val}</span></div>`;
  }
  html += '</div>';

  html += `<div class="sys-card"><h4>连接信息</h4>
    <div class="sys-row"><span class="label">用户</span><span class="value">${esc(ST.userName)}</span></div>
    <div class="sys-row"><span class="label">用户 ID</span><span class="value">${esc(ST.userId)}</span></div>
    <div class="sys-row"><span class="label">角色</span><span class="value">${ST.role}</span></div>
    <div class="sys-row"><span class="label">端点</span><span class="value">${esc(ST.base)}</span></div>
    <div class="sys-row"><span class="label">会话</span><span class="value">${ST.sessions.length}</span></div>
    <div class="sys-row"><span class="label">文档</span><span class="value">${ST.docs.length}</span></div>
  </div>`;

  $('sys-content').innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════════════
   Admin Panel
   ═══════════════════════════════════════════════════════════════════ */
async function loadUsers() {
  if (!ST.connected || ST.role !== 'admin') return;
  try {
    const users = await api('GET', '/users');
    renderUsers(users);
  } catch (e) { toast('加载用户失败: ' + e.message); }
}

async function doCreateUser() {
  const name = $('new-user-name').value.trim();
  const role = $('new-user-role').value;
  if (!name) { toast('请输入用户名'); return; }
  try {
    await api('POST', '/users', { name, role });
    $('new-user-name').value = '';
    toast(`用户已创建: ${name} [${role}]`, 'ok');
    await loadUsers();
  } catch (e) { toast('创建用户失败: ' + e.message); }
}

async function doDeleteUser(uid, name, ev) {
  ev.stopPropagation();
  if (!confirm(`删除用户 ${name}？\n其所有 API Key 将被撤销。`)) return;
  try {
    await api('DELETE', `/users/${uid}`);
    toast(`用户已删除: ${name}`, 'ok');
    await loadUsers();
  } catch (e) { toast('删除失败: ' + e.message); }
}

async function doGenKey(uid, name, ev) {
  ev.stopPropagation();
  try {
    const k = await api('POST', '/api-keys', { user_id: uid });
    toast(`Key 已生成 — 仅此一次！已复制到剪贴板: ${k.key}`, 'ok');
    navigator.clipboard?.writeText(k.key);
    await loadUsers();
  } catch (e) { toast('生成 Key 失败: ' + e.message); }
}

async function doRevokeKey(prefix, ev) {
  ev.stopPropagation();
  if (!confirm(`撤销 Key ${prefix}？`)) return;
  try {
    await api('DELETE', `/api-keys/${encodeURIComponent(prefix)}`);
    toast('Key 已撤销', 'ok');
    await loadUsers();
  } catch (e) { toast('撤销失败: ' + e.message); }
}

async function loadUserKeys(uid) {
  try { return await api('GET', `/users/${uid}/api-keys`); }
  catch (_) { return []; }
}

async function renderUsers(users) {
  const el = $('user-list');
  if (!users || !users.length) { el.innerHTML = '<div class="empty-note">暂无用户</div>'; return; }
  const keyMap = {};
  await Promise.all(users.map(async u => {
    keyMap[u.user_id] = await loadUserKeys(u.user_id);
  }));

  el.innerHTML = users.map(u => {
    const keys = keyMap[u.user_id] || [];
    const keyHtml = keys.length ? keys.map(k => {
      const isRevoked = !!k.revoked_at;
      return `<div class="key-row">
        <span class="kpre" style="color:${isRevoked ? 'var(--faint)' : 'var(--ink)'}">${esc(k.prefix)}</span>
        <span class="kts">${new Date(k.created_at).toLocaleDateString()}</span>
        ${isRevoked ? '<span style="color:var(--markup);font-size:0.6rem;">已撤销</span>'
          : `<button class="mini-btn danger" onclick="doRevokeKey('${esc(k.prefix)}',event)">撤销</button>`}
      </div>`;
    }).join('') : '<div style="font-size:var(--text-xs);color:var(--faint);">无 API Key</div>';

    return `<div class="user-card">
      <div class="row1">
        <span class="uname">${esc(u.name)}</span>
        <span class="scope-chip">${u.role}</span>
        <span class="meta">${new Date(u.created_at).toLocaleDateString()}</span>
        <button class="mini-btn" onclick="doGenKey('${u.user_id}','${esc(u.name)}',event)">+Key</button>
        <button class="mini-btn danger" onclick="doDeleteUser('${u.user_id}','${esc(u.name)}',event)">删除</button>
      </div>
      <div class="row2">${keyHtml}</div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════════════
   Utilities
   ═══════════════════════════════════════════════════════════════════ */
function fmtSize(b) {
  if (!b) return '0B';
  return b < 1024 ? `${b}B` : b < 1024*1024 ? `${(b/1024).toFixed(1)}KB` : `${(b/(1024*1024)).toFixed(1)}MB`;
}
function esc(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
function md(text) {
  if (!text) return '';
  try {
    if (typeof marked !== 'undefined') return marked.parse(text);
  } catch (_) {}
  return `<p>${esc(text)}</p>`;
}

/* ═══════════════════════════════════════════════════════════════════
   Event Bindings
   ═══════════════════════════════════════════════════════════════════ */
// Tabs
$('tab-bar').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  $('tab-bar').querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  $('tab-' + btn.dataset.tab).classList.add('active');
  if (btn.dataset.tab === 'system') renderSystem();
  if (btn.dataset.tab === 'admin') loadUsers();
});

// Drag & drop
const uz = $('upload-zone');
uz.addEventListener('dragover', e => { e.preventDefault(); uz.classList.add('dragover'); });
uz.addEventListener('dragleave', () => uz.classList.remove('dragover'));
uz.addEventListener('drop', e => {
  e.preventDefault(); uz.classList.remove('dragover');
  if (e.dataTransfer.files[0]) doUpload(e.dataTransfer.files[0]);
});
uz.addEventListener('click', () => $('file-input').click());

// Textarea auto-resize
$('chat-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});

// Enter to send
$('chat-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});

// Enter on key/base → connect
$('api-key').addEventListener('keydown', e => { if (e.key === 'Enter') doConnect(); });
$('api-base').addEventListener('keydown', e => { if (e.key === 'Enter') doConnect(); });

// Non-admin can't select shared upload scope
$('upload-scope').addEventListener('focus', function() {
  if (ST.role !== 'admin') { this.value = 'private'; toast('仅管理员可上传共享文档', 'info'); }
});
</script>
</body>
